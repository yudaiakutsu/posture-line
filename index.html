<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="姿勢ライン">
<title>姿勢ライン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-load" class="topbtn">写真</button>
    <span id="title">姿勢ライン</span>
    <button id="btn-export" class="topbtn primary" disabled>A4保存</button>
  </header>

  <div id="slots">
    <button class="slotbtn active" data-slot="0">① 前額面</button>
    <button class="slotbtn" data-slot="1">② 矢状面</button>
  </div>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="zoombox">
      <button id="zoom-in" class="zbtn">＋</button>
      <button id="zoom-out" class="zbtn">－</button>
      <button id="zoom-fit" class="zbtn">⤢</button>
    </div>
    <div id="hint">「写真」を押して<br><b id="hint-label">前額面</b>の写真を選んでください</div>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="tilt">傾き</button>
    <button class="tab" data-tab="plumb">重心線</button>
    <button class="tab" data-tab="grid">グリッド</button>
  </nav>

  <div id="panel">
    <!-- 傾き -->
    <section class="pane active" data-pane="tilt">
      <div class="row">
        <button class="step" id="tilt-m1">‹ 1°</button>
        <button class="step" id="tilt-m01">‹ 0.1</button>
        <span id="tilt-val" class="val">0.0°</span>
        <button class="step" id="tilt-p01">0.1 ›</button>
        <button class="step" id="tilt-p1">1° ›</button>
      </div>
      <input type="range" id="tilt-range" min="-20" max="20" step="0.1" value="0">
      <div class="row"><button class="wide" id="tilt-reset">水平に戻す（0°）</button></div>
      <p class="tip">写真が傾いていたらここで水平を出します。</p>
    </section>

    <!-- 重心線 -->
    <section class="pane" data-pane="plumb">
      <div class="row">
        <label class="chk"><input type="checkbox" id="plumb-on" checked> 重心線を表示</label>
        <button class="wide" id="plumb-center">中央に戻す</button>
      </div>
      <div class="row"><span class="lbl">太さ</span><input type="range" id="plumb-w" min="1" max="8" step="1" value="2"></div>
      <p class="tip">赤い線を指でドラッグすると左右に動きます（垂直のまま）。</p>
    </section>

    <!-- グリッド -->
    <section class="pane" data-pane="grid">
      <div class="row">
        <label class="chk"><input type="checkbox" id="grid-on"> グリッドを表示</label>
      </div>
      <div class="row"><span class="lbl">間隔</span><input type="range" id="grid-gap" min="20" max="120" step="2" value="48"></div>
      <p class="tip">縦線は重心線を中心に左右対称、横線は上下対称に並びます。</p>
    </section>
  </div>

  <input id="file" type="file" accept="image/*" hidden>
</div>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
